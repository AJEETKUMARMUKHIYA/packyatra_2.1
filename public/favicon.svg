<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#0F2753" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Formal Corporate Shield & 3D Isometric Cube -->
  <g transform="translate(16, 12)" filter="url(#shadow)">
    <!-- Shield Body -->
    <path 
      d="M 22 8 L 74 8 C 84 8 90 14 90 24 L 90 54 C 90 74 58 90 48 95 C 38 90 6 74 6 54 L 6 24 C 6 14 12 8 22 8 Z" 
      fill="url(#shieldGrad)"
      stroke="#3B82F6"
      stroke-width="2"
    />

    <!-- Inner Shield Inset Hairline -->
    <path 
      d="M 24 12 L 72 12 C 80 12 85 17 85 26 L 85 52 C 85 68 56 83 48 87 C 40 83 11 68 11 52 L 11 26 C 11 17 16 12 24 12 Z" 
      fill="none"
      stroke="rgba(255, 255, 255, 0.2)"
      stroke-width="1"
    />

    <!-- 3D Isometric Freight Transit Cube -->
    <!-- Top Face -->
    <polygon points="48,22 72,35 48,48 24,35" fill="url(#topFace)" />
    <!-- Forward Speed Arrow on Top Face -->
    <path d="M 43 36 L 52 36 L 54 34 L 49 31 L 42 31 L 45 34 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Left Face ('P') -->
    <polygon points="24,35 48,48 48,70 24,57" fill="url(#leftFace)" />
    <!-- Stylized Architectural 'P' on Left Face -->
    <path d="M 31 42 L 38 46 L 38 58 L 34 56 L 34 50 L 31 48 Z" fill="rgba(255, 255, 255, 0.28)"/>

    <!-- Right Face ('Y') -->
    <polygon points="48,48 72,35 72,57 48,70" fill="url(#rightFace)" />
    <!-- Dynamic Transit Speed Stripe on Right Face -->
    <polygon points="52,50 56,48 68,55 64,57" fill="rgba(255, 255, 255, 0.35)"/>

    <!-- Cube Edges -->
    <line x1="48" y1="48" x2="48" y2="70" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="24" y1="35" x2="48" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="72" y1="35" x2="48" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

    <!-- 5-Star Quality Laurel & Gold Star Seal -->
    <path d="M 34 75 Q 48 80 62 75" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="48,73 49.6,77 54,77 50.4,79.5 51.8,83.5 48,81 44.2,83.5 45.6,79.5 42,77 46.4,77" fill="#F59E0B"/>
  </g>
</svg>
